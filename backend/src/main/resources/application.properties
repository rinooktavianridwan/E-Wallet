spring.application.name=e-wallet
server.port=${PORT:${SERVER_PORT:8080}}

# Load local .env if present (ignored when the file does not exist, e.g. in production)
spring.config.import=optional:file:.env[.properties]

# Database (override via environment variables when deploying)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ewallet}
spring.datasource.username=${DB_USERNAME:ewallet}
spring.datasource.password=${DB_PASSWORD:ewallet}

# Schema is owned by Flyway; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# JWT (secret minimal 32 karakter, wajib diisi lewat JWT_SECRET)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# Cookie refresh token: Secure wajib true saat produksi (HTTPS)
app.cookie.secure=${COOKIE_SECURE:false}

# CORS: alamat frontend yang boleh memanggil API, dipisah koma
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Dokumentasi API (Swagger UI): isi SWAGGER_ENABLED=false di produksi bila tidak ingin dibuka ke publik
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# Store timestamps in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Actuator: expose only health
management.endpoints.web.exposure.include=health
