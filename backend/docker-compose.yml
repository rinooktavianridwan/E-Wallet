# Development: PostgreSQL + API. Pengaturan dari backend/.env
services:
  db:
    image: postgres:16
    container_name: ewallet-db
    environment:
      POSTGRES_DB: ${DB_NAME:-ewallet}
      POSTGRES_USER: ${DB_USERNAME:-ewallet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ewallet}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ewallet-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ewallet} -d ${DB_NAME:-ewallet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ewallet-app
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-ewallet}
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  ewallet-data:
    name: ewallet-data
