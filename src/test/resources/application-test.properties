# Profil "test": dipakai test lewat @ActiveProfiles("test").
# Test memakai database terpisah supaya data development tidak ikut terhapus.
# Buat sekali: psql -U postgres -c "CREATE DATABASE ewallet_test;"
# Username dan password tetap diambil dari DB_USERNAME / DB_PASSWORD (.env).
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/ewallet_test}

app.jwt.secret=secret-khusus-test-minimal-32-karakter-0123456789
app.jwt.expiration-minutes=60
